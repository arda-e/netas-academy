stages:
  - lint
  - test
  - e2e
  - build
  - deploy

variables:
  NODE_VERSION: "22"
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""

.node_job:
  image: node:22-bookworm
  cache:
    key: "$CI_COMMIT_REF_SLUG"
    paths:
      - .npm/
      - frontend/.npm/
      - backend/.npm/
      - e2e/.npm/
  before_script:
    - npm ci --cache .npm --prefer-offline
    - npm ci --prefix frontend --cache frontend/.npm --prefer-offline
    - npm ci --prefix backend --cache backend/.npm --prefer-offline

frontend_lint:
  extends: .node_job
  stage: lint
  script:
    - npm run lint

frontend_tests:
  extends: .node_job
  stage: test
  needs:
    - frontend_lint
  script:
    - npm run test:coverage --prefix frontend

backend_tests:
  extends: .node_job
  stage: test
  needs:
    - frontend_lint
  script:
    - npm run test --prefix backend

playwright_e2e:
  extends: .node_job
  stage: e2e
  needs:
    - frontend_tests
    - backend_tests
  before_script:
    - npm ci --cache .npm --prefer-offline
    - npm ci --prefix frontend --cache frontend/.npm --prefer-offline
    - npm ci --prefix backend --cache backend/.npm --prefer-offline
    - npm ci --prefix e2e --cache e2e/.npm --prefer-offline
    - npx --prefix e2e playwright install --with-deps chromium
  script:
    - npm run seed:demo
    - npm run test --prefix e2e
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - e2e/playwright-report/
      - e2e/test-results/

build_image:
  image: docker:29-cli
  stage: build
  services:
    - name: docker:29-dind
      command: ["--tls=false"]
  needs:
    - playwright_e2e
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
  script:
    - docker build --pull -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA" -t "$CI_REGISTRY_IMAGE:production" -f Dockerfile .
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"
    - docker push "$CI_REGISTRY_IMAGE:production"

.deploy_template:
  image: alpine:3.22
  stage: deploy
  needs:
    - build_image
  before_script:
    - apk add --no-cache bash openssh-client
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - printf '%s\n' "$PRODUCTION_SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/production_deploy_key
    - chmod 600 ~/.ssh/production_deploy_key
    - ssh-keyscan -H "$PRODUCTION_HOST" >> ~/.ssh/known_hosts
  script:
    - bash ci/deploy-gitlab-production.sh

deploy_production:
  extends: .deploy_template
  environment:
    name: production
    url: https://new.netasacademy.com
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

deploy_production_manual:
  extends: .deploy_template
  environment:
    name: production
    url: https://new.netasacademy.com
  when: manual
  allow_failure: false
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
