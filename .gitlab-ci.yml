stages:
  - lint
  - test
  - e2e
  - build
  - deploy

variables:
  NODE_VERSION: "22"
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""
  DOCKER_BUILDKIT: "1"

.node_job:
  image: node:22-bookworm
  cache:
    key: "$CI_COMMIT_REF_SLUG"
    paths:
      - .npm/
      - frontend/.npm/
      - backend/.npm/
      - e2e/.npm/

frontend_lint:
  extends: .node_job
  stage: lint
  before_script:
    - npm ci --prefix frontend --cache frontend/.npm --prefer-offline
  script:
    - npm run lint --prefix frontend

frontend_tests:
  extends: .node_job
  stage: test
  allow_failure: true
  needs:
    - frontend_lint
  before_script:
    - npm ci --prefix frontend --cache frontend/.npm --prefer-offline
  script:
    - npm run test:coverage --prefix frontend

backend_tests:
  extends: .node_job
  stage: test
  allow_failure: true
  needs:
    - frontend_lint
  before_script:
    - npm ci --prefix backend --cache backend/.npm --prefer-offline
  script:
    - npm run test --prefix backend

playwright_e2e:
  extends: .node_job
  image: mcr.microsoft.com/playwright:v1.60.0-noble
  stage: e2e
  allow_failure: true
  needs:
    - frontend_tests
    - backend_tests
  before_script:
    - npm ci --prefix frontend --cache frontend/.npm --prefer-offline
    - npm ci --prefix backend --cache backend/.npm --prefer-offline
    - npm ci --prefix e2e --cache e2e/.npm --prefer-offline
  script:
    - npm run seed:demo --prefix backend
    - npm run test --prefix e2e
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - e2e/playwright-report/
      - e2e/test-results/

build_image:
  image: docker:29-cli
  stage: build
  services:
    - name: docker:29-dind
      command: ["--tls=false"]
  needs:
    - playwright_e2e
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
    - docker buildx create --use --name netas-academy-builder
  script:
    - >
      docker buildx build --pull --push
      --cache-from type=registry,ref="$CI_REGISTRY_IMAGE:buildcache"
      --cache-to type=registry,ref="$CI_REGISTRY_IMAGE:buildcache",mode=max
      --build-arg STRAPI_BUILD_DUMMY_1=ci-build-admin-jwt-secret
      --build-arg STRAPI_BUILD_DUMMY_2=ci-build-api-token-salt
      --build-arg STRAPI_BUILD_DUMMY_3=ci-build-transfer-token-salt
      --build-arg STRAPI_BUILD_DUMMY_4=ci-build-encryption-key
      --build-arg STRAPI_BUILD_SMTP_USER=ci-build-smtp-user
      --build-arg STRAPI_BUILD_SMTP_PASS=ci-build-smtp-pass
      -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"
      -t "$CI_REGISTRY_IMAGE:production"
      -f Dockerfile .

.deploy_template:
  image: alpine:3.22
  stage: deploy
  needs:
    - build_image
  before_script:
    - apk add --no-cache bash openssh-client
    - test -n "$PRODUCTION_HOST"
    - test -n "$PRODUCTION_USER"
    - test -n "$PRODUCTION_APP_DIR"
    - test -n "$PRODUCTION_SSH_PRIVATE_KEY"
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - printf '%s\n' "$PRODUCTION_SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/production_deploy_key
    - chmod 600 ~/.ssh/production_deploy_key
    - ssh-keyscan -T 20 -p "${PRODUCTION_SSH_PORT:-22}" -H "$PRODUCTION_HOST" >> ~/.ssh/known_hosts
  script:
    - bash ci/deploy-gitlab-production.sh

deploy_production:
  extends: .deploy_template
  environment:
    name: production
    url: https://new.netasacademy.com
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

deploy_production_manual:
  extends: .deploy_template
  environment:
    name: production
    url: https://new.netasacademy.com
  when: manual
  allow_failure: false
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
