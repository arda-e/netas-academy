upstream netas_academy_frontend {
  server app:3000;
  keepalive 32;
}

upstream netas_academy_strapi {
  server app:1337;
  keepalive 32;
}

server {
  listen 80;
  server_name new.netasacademy.com;

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  http2 on;
  server_name new.netasacademy.com;

  ssl_certificate /etc/letsencrypt/live/new.netasacademy.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/new.netasacademy.com/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;

  client_max_body_size 25m;

  location / {
    proxy_pass http://netas_academy_frontend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port 443;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
  }
}

server {
  listen 1337 ssl;
  http2 on;
  server_name new.netasacademy.com;

  ssl_certificate /etc/letsencrypt/live/new.netasacademy.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/new.netasacademy.com/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;

  client_max_body_size 100m;

  location / {
    proxy_pass http://netas_academy_strapi;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port 1337;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }
}
