services:
  app:
    image: ${APP_IMAGE:-netas-academy:local}
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      FRONTEND_PORT: 3000
      STRAPI_URL: ${STRAPI_URL:-http://127.0.0.1:1337}
      STRAPI_PUBLIC_URL: ${STRAPI_PUBLIC_URL:-http://localhost:1337}
      HOST: 0.0.0.0
      PORT: 1337
      APP_KEYS: ${APP_KEYS:-app-key-1,app-key-2,app-key-3,app-key-4}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET:-change-admin-jwt-secret}
      API_TOKEN_SALT: ${API_TOKEN_SALT:-change-api-token-salt}
      TRANSFER_TOKEN_SALT: ${TRANSFER_TOKEN_SALT:-change-transfer-token-salt}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-change-encryption-key}
      JWT_SECRET: ${JWT_SECRET:-change-jwt-secret}
      DATABASE_CLIENT: sqlite
      DATABASE_FILENAME: .tmp/data.db
      EMAIL_PROVIDER: nodemailer
      EMAIL_SMTP_HOST: smtp-relay.brevo.com
      EMAIL_SMTP_PORT: "587"
      EMAIL_SMTP_SECURE: "false"
      EMAIL_SMTP_USER: ${EMAIL_SMTP_USER:-}
      EMAIL_SMTP_PASS: ${EMAIL_SMTP_PASS:-}
      EMAIL_DEFAULT_FROM: ${EMAIL_DEFAULT_FROM:-Netas Academy <no-reply@netasacademy.com>}
      EMAIL_DEFAULT_REPLY_TO: ${EMAIL_DEFAULT_REPLY_TO:-support@netasacademy.com}
      EMAIL_TEST_ADDRESS: ${EMAIL_TEST_ADDRESS:-test@netasacademy.com}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_ACCESS_SECRET: ${AWS_ACCESS_SECRET:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_REGION: ${AWS_REGION:-}
      AWS_BUCKET: ${AWS_BUCKET:-}
      AWS_ACL: ${AWS_ACL:-public-read}
      AWS_CACHE_CONTROL: ${AWS_CACHE_CONTROL:-public, max-age=31536000, immutable}
      MEDIA_PUBLIC_URL: ${MEDIA_PUBLIC_URL:-}
      MEDIA_ROOT_PATH: ${MEDIA_ROOT_PATH:-uploads}
    volumes:
      - ./.docker-data/strapi:/app/backend/.tmp
      - ./.docker-data/uploads:/app/backend/public/uploads
    ports:
      - "3000:3000"
      - "1337:1337"
    healthcheck:
      test: ["CMD-SHELL", "curl --globoff --fail --silent http://127.0.0.1:3000/ >/dev/null && curl --globoff --fail --silent 'http://127.0.0.1:1337/api/events?pagination[pageSize]=1' >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 45s
