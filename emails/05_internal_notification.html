<!doctype html>
<html lang="tr" xmlns="http://www.w3.org/1999/xhtml" xmlns:v="urn:schemas-microsoft-com:vml" xmlns:o="urn:schemas-microsoft-com:office:office">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="x-apple-disable-message-reformatting">
  <meta name="format-detection" content="telephone=no,address=no,email=no,date=no,url=no">
  <meta name="color-scheme" content="light dark">
  <meta name="supported-color-schemes" content="light dark">
  <title>{{params.headline}}</title>
  <!--[if gte mso 9]>
  <xml>
    <o:OfficeDocumentSettings>
      <o:AllowPNG/>
      <o:PixelsPerInch>96</o:PixelsPerInch>
    </o:OfficeDocumentSettings>
  </xml>
  <![endif]-->
  <!--[if mso]>
  <style type="text/css">
    body, table, td, a, span, p, h1, h2, h3 { font-family: Arial, Helvetica, sans-serif !important; }
  </style>
  <![endif]-->
  <style type="text/css">
body, table, td, a { -webkit-text-size-adjust:100%; -ms-text-size-adjust:100%; }
table, td { mso-table-lspace:0pt; mso-table-rspace:0pt; }
img { -ms-interpolation-mode:bicubic; border:0; height:auto; line-height:100%; outline:none; text-decoration:none; display:block; }
table { border-collapse:collapse !important; }
body { margin:0 !important; padding:0 !important; width:100% !important; background-color:#f4f7fb; }
a { text-decoration:none; }
.ExternalClass { width:100%; }
.ExternalClass, .ExternalClass p, .ExternalClass span, .ExternalClass font, .ExternalClass td, .ExternalClass div { line-height:100%; }
.ReadMsgBody { width:100%; }
.preheader { display:none !important; visibility:hidden; opacity:0; color:transparent; height:0; width:0; overflow:hidden; mso-hide:all; }
@media screen and (max-width: 620px) {
  .container { width:100% !important; max-width:100% !important; }
  .mobile-pad { padding-left:20px !important; padding-right:20px !important; }
  .h1 { font-size:22px !important; line-height:28px !important; }
}
@media (prefers-color-scheme: dark) {
  body, .body-bg { background-color:#0f172a !important; }
  .card { background-color:#111827 !important; }
  .text-main { color:#f8fafc !important; }
  .text-muted { color:#cbd5e1 !important; }
  .divider { border-color:#334155 !important; }
  .row-border { border-top-color:#334155 !important; }
  .soft-bg { background-color:#1e293b !important; }
  .soft-border { border-color:#334155 !important; }
}
  </style>
</head>
<body class="body-bg" style="margin:0;padding:0;background-color:#f4f7fb;">
  <div class="preheader">{{params.preheader}}</div>
  <center role="article" aria-roledescription="email" lang="tr" style="width:100%;background-color:#f4f7fb;">
    <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="width:100%;background-color:#f4f7fb;" class="body-bg">
      <tr>
        <td align="center" style="padding:28px 12px;">
          <!--[if mso]><table role="presentation" cellpadding="0" cellspacing="0" border="0" style="width:600px;"><tr><td><![endif]-->
          <table role="presentation" cellpadding="0" cellspacing="0" border="0" class="container card" style="width:600px;max-width:600px;background-color:#ffffff;border-radius:16px;overflow:hidden;">

            <!-- Header -->
            <tr>
              <td class="mobile-pad" style="padding:22px 32px 14px 32px;background-color:#ffffff;font-family:Arial,Helvetica,sans-serif;">
                <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="width:100%;">
                  <tr>
                    <td valign="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:16px;line-height:22px;font-weight:bold;color:#0f172a;" class="text-main">
                      <span style="color:#009ca6;">NETAS</span> AKADEMİ
                    </td>
                    <td align="right" valign="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:11px;line-height:16px;color:#94a3b8;letter-spacing:.06em;text-transform:uppercase;" class="text-muted">
                      İç Bildirim
                    </td>
                  </tr>
                </table>
              </td>
            </tr>

            <!-- Divider -->
            <tr>
              <td style="padding:0 32px;">
                <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="width:100%;" class="divider">
                  <tr><td style="height:1px;background-color:#e2e8f0;font-size:0;line-height:0;">&nbsp;</td></tr>
                </table>
              </td>
            </tr>

            <!-- Badge + headline -->
            <tr>
              <td class="mobile-pad" style="padding:24px 32px 10px 32px;font-family:Arial,Helvetica,sans-serif;">
                <p style="margin:0 0 12px 0;">
                  <span style="display:inline-block;background-color:{{params.badgeBg}};color:{{params.badgeColor}};border-radius:999px;padding:5px 12px;font-size:11px;line-height:16px;font-weight:bold;letter-spacing:.04em;text-transform:uppercase;">{{params.badgeText}}</span>
                </p>
                <h1 class="h1 text-main" style="margin:0;color:#0f172a;font-family:Arial,Helvetica,sans-serif;font-size:24px;line-height:30px;font-weight:bold;">{{params.headline}}</h1>
              </td>
            </tr>

            <!-- Data table -->
            <tr>
              <td class="mobile-pad" style="padding:16px 32px 24px 32px;">
                <table role="presentation" cellpadding="0" cellspacing="0" border="0" class="soft-bg soft-border" style="width:100%;background-color:#f8fafc;border:1px solid #e2e8f0;border-radius:12px;">
                  <tr>
                    <td style="padding:4px 20px 16px 20px;font-family:Arial,Helvetica,sans-serif;">
                      <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="width:100%;">
                        {{params.rows}}
                      </table>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>

            <!-- Footer -->
            <tr>
              <td class="mobile-pad" style="padding:0 32px 28px 32px;font-family:Arial,Helvetica,sans-serif;font-size:12px;line-height:18px;color:#94a3b8;text-align:center;" class="text-muted">
                <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="width:100%;" class="divider">
                  <tr><td style="height:1px;background-color:#e2e8f0;font-size:0;line-height:0;margin-bottom:16px;">&nbsp;</td></tr>
                </table>
                <p style="margin:12px 0 0 0;">Bu bildirim Netas Academy yönetim sistemi tarafından otomatik olarak gönderilmiştir.</p>
              </td>
            </tr>

          </table>
          <!--[if mso]></td></tr></table><![endif]-->
        </td>
      </tr>
    </table>
  </center>
</body>
</html>
